name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build:rn

# Releases are published exclusively via the manual Publish workflow
# (.github/workflows/publish.yml), which regenerates the native artifacts
# (build:core, docs) before running semantic-release.
